name: ai_safe_route_finder
description: "SIH Prototype - AI Safe Route Finder (Safe. Smart. Together.)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  geolocator: ^14.1.1
  url_launcher: ^6.3.3
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.0
  sensors_plus: ^7.1.1
  flutter_tts: ^4.2.5
  another_telephony: ^0.4.1
  flutter_phone_direct_caller: ^2.2.1
  battery_plus: ^7.1.2
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpeg"